<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL Product Filter</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dde1e7; --accent: #2f5fd0; --accent-text: #ffffff;
    --ok: #1a7f4b; --ok-bg: #e3f4ea; --warn: #9a6700; --warn-bg: #fff3d1;
    --bad: #b42318; --bad-bg: #fde7e4; --code-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --surface: #1c2025; --text: #e6e9ed; --muted: #97a1ae;
      --border: #2f353d; --accent: #6f95f0; --accent-text: #0e1116;
      --ok: #5fd39a; --ok-bg: #16332599; --warn: #f0c35a; --warn-bg: #3a2f0f;
      --bad: #ff8a7d; --bad-bg: #3f1b17; --code-bg: #14171b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  textarea { width: 100%; min-height: 84px; resize: vertical; padding: 12px;
             border: 1px solid var(--border); border-radius: 8px;
             background: var(--bg); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .run { background: var(--accent); color: var(--accent-text); border: 0;
         padding: 9px 20px; font-weight: 600; }
  .group { margin-bottom: 14px; }
  .group:last-child { margin-bottom: 0; }
  .group-name { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .ex { background: var(--bg); color: var(--text); border: 1px solid var(--border);
        padding: 6px 11px; font-size: 13.5px; text-align: left; }
  .ex:hover:not(:disabled) { border-color: var(--accent); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px;
           font-size: 12.5px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .res-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .query { color: var(--muted); font-size: 13.5px; word-break: break-word; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tag { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
         padding: 3px 9px; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  .tag b { color: var(--accent); font-weight: 600; }
  .errmsg { color: var(--bad); margin: 0 0 12px; word-break: break-word; }
  pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border);
        border-radius: 8px; padding: 14px; overflow-x: auto;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .copy { background: transparent; color: var(--muted); border: 1px solid var(--border);
          padding: 3px 10px; font-size: 12.5px; margin-left: auto; }
  .empty { color: var(--muted); }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border);
             border-top-color: var(--accent); border-radius: 50%;
             display: none; animation: spin .7s linear infinite; }
  .busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>NL Product Filter</h1>
  <p class="sub">Type a product search in plain English and see the API request it turns into.</p>

  <div class="card" id="inputCard">
    <h2>Your query</h2>
    <textarea id="query" maxlength="500"
      placeholder="e.g. Find dead gadgets under $500, newest first, limit 20"></textarea>
    <div class="row">
      <button class="run" id="runBtn">Run</button>
      <span class="spinner" id="spinner"></span>
      <span class="hint" id="hint">Ctrl/Cmd + Enter to run</span>
    </div>
  </div>

  <div class="card">
    <h2>Examples</h2>
    <div id="examples" class="empty">Loading examples…</div>
  </div>

  <div class="card" id="resultCard">
    <h2>Result</h2>
    <div id="result" class="empty">Run a query or click an example to see the result.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const queryEl = $("query"), runBtn = $("runBtn"), resultEl = $("result");
let busy = false;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function setBusy(on) {
  busy = on;
  document.body.classList.toggle("busy", on);
  document.querySelectorAll("button").forEach((b) => (b.disabled = on));
}

function badgeClass(code) {
  if (code === 200) return "ok";
  if (code === 400 || code === 500) return "bad";
  return "warn";
}

function fmtValue(v) {
  return Array.isArray(v) ? v.join(" – ") : String(v);
}

function addTag(parent, label, text) {
  const t = el("span", "tag");
  const b = el("b", null, label + " ");
  t.append(b, document.createTextNode(text));
  parent.appendChild(t);
}

function renderResult(query, data, ms) {
  resultEl.className = "";
  resultEl.replaceChildren();

  const head = el("div", "res-head");
  head.append(el("span", "badge " + badgeClass(data.code), data.status + " · " + data.code));
  head.append(el("span", "query", "“" + query + "” · " + ms + " ms"));
  resultEl.appendChild(head);

  if (data.error) resultEl.appendChild(el("p", "errmsg", data.error.message));

  const body = data.request && data.request.body;
  if (body) {
    const summary = el("div", "summary");
    body.filters.forEach((f) => addTag(summary, f.field, f.operator + " " + fmtValue(f.value)));
    (body.sort || []).forEach((s) => addTag(summary, "sort", s.field + " " + s.direction));
    addTag(summary, "page", body.pagination.page);
    addTag(summary, "limit", body.pagination.limit);
    resultEl.appendChild(summary);
  }

  const json = JSON.stringify(data, null, 2);
  const copy = el("button", "copy", "Copy JSON");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(json); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
    setTimeout(() => (copy.textContent = "Copy JSON"), 1400);
  };
  head.appendChild(copy);
  resultEl.appendChild(el("pre", null, json));
}

function renderError(msg) {
  resultEl.className = "";
  resultEl.replaceChildren();
  const head = el("div", "res-head");
  head.append(el("span", "badge bad", "REQUEST FAILED"));
  resultEl.append(head, el("p", "errmsg", msg));
}

async function run(query) {
  query = query.trim();
  if (!query || busy) return;
  queryEl.value = query;
  setBusy(true);
  resultEl.className = "empty";
  resultEl.textContent = "Running…";
  const start = performance.now();
  try {
    const res = await fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    renderResult(query, data, Math.round(performance.now() - start));
  } catch (err) {
    renderError(err.message || "Could not reach the server.");
  } finally {
    setBusy(false);
  }
}

async function loadExamples() {
  const box = $("examples");
  try {
    const res = await fetch("/api/examples");
    const groups = await res.json();
    box.className = "";
    box.replaceChildren();
    for (const [name, queries] of Object.entries(groups)) {
      const g = el("div", "group");
      g.appendChild(el("div", "group-name", name));
      const chips = el("div", "chips");
      queries.forEach((q) => {
        const b = el("button", "ex", q);
        b.onclick = () => run(q);
        chips.appendChild(b);
      });
      g.appendChild(chips);
      box.appendChild(g);
    }
  } catch {
    box.textContent = "Could not load examples.";
  }
}

runBtn.onclick = () => run(queryEl.value);
queryEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(queryEl.value); }
});
loadExamples();
</script>
</body>
</html>
